<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for( 'static', path='/edit_password-page-style.css' ) }}">
    <link id="favicon" rel="icon" type="image/x-icon" href="/img/svg/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

    <title>Изменить пароль</title>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a class="header__logo" href="{{ url_for( 'homepage' ) }}">
                <div class="header__logo_img"></div>
                <p class="header__logo_text">
                    A-Frame.Kam
                </p>
                <p class="header__logo_text-hidden">
                    A-F.K
                </p>
            </a>
            <div class="header__nav">
                <ul class="header__nav_list">
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="{{ url_for( 'homepage' ) }}#contacts">
                            Контакты
                        </a>
                    </li>
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="{{ url_for( 'homepage' ) }}#gallery">
                            Галерея
                        </a>
                    </li>
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="{{ url_for( 'homepage' ) }}">
                            На главную
                        </a>
                    </li>
                </ul>
            </div>
            <div class="header__menu">
                <div class="icon-line"></div>
                <div class="icon-line"></div>
                <div class="icon-line"></div>
                <div class="menu-container">
                    <a class="menu-container__link" href="{{ url_for( 'homepage' ) }}#contacts">Контакты</a>
                    <a class="menu-container__link" href="{{ url_for( 'homepage' ) }}#gallery">Галерея</a>
                    <a class="menu-container__link" href="{{ url_for( 'homepage' ) }}">На главную</a>
                </div>  
            </div>
        </div>
    </header>
    <main class="main">
        <section class="section-1">
            <h1 class="section-1__title">
                Сброс пароля
            </h1>
        </section>
        <section class="section-2 _container">
            <form class="section-2__input-block" id="edit-password-form">
                <input type="hidden" name="token" value="{{ token }}">
                <input class="section-2__input-block_input _contact" type="password" name="password" placeholder="Новый пароль" required>
                <button class="section-2__input-block_button" type="submit">Изменить пароль</button>
            </form>
            <div id="answer" style="margin-top: 10px;"></div>
            <script>
                const editForm = document.getElementById("edit-password-form")

                editForm.addEventListener("submit", async (event) => {
                    event.preventDefault()

                    const formData = new FormData(event.target)
                    try {
                        const response = await fetch("/auth/reset-password", {
                            method: 'POST',
                            body: formData
                        })
                        .catch(err => new Error(err))
                        if (response.ok) {
                            window.location.href = "/login";
                        } 
                    } catch (error) {
                        document.getElementById('answer').textContent = "Ошибочка вышла, попробуйте снова " + error
                    }
                })
            </script>
        </section>
    </main>
    <footer class="footer">
        <div class="footer__policy">
            <p class="footer__policy_text">
                © Все права защищены
            </p>
        </div>
    </footer>
    <script src="{{ url_for( 'static', path='/menu.js' ) }}"></script>
</body>
</html>
