<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for( 'static', path='/login-page-style.css' ) }}">
    <link id="favicon" rel="icon" type="image/x-icon" href="/img/svg/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

    <title>Вход</title>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a class="header__logo" href="{{ url_for( 'homepage' ) }}">
                <div class="header__logo_img"></div>
                <p class="header__logo_text">
                    A-Frame.Kam
                </p>
                <p class="header__logo_text-hidden">
                    A-F.K
                </p>
            </a>
            <div class="header__nav">
                <ul class="header__nav_list">
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="{{ url_for( 'homepage' ) }}#contacts">
                            Контакты
                        </a>
                    </li>
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="{{ url_for( 'homepage' ) }}#gallery">
                            Галерея
                        </a>
                    </li>
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="{{ url_for( 'homepage' ) }}">
                            На главную
                        </a>
                    </li>
                </ul>
            </div>
            <div class="header__menu">
                <div class="icon-line"></div>
                <div class="icon-line"></div>
                <div class="icon-line"></div>
                <div class="menu-container">
                    <a class="menu-container__link" href="{{ url_for( 'homepage' ) }}#contacts">Контакты</a>
                    <a class="menu-container__link" href="{{ url_for( 'homepage' ) }}#gallery">Галерея</a>
                    <a class="menu-container__link" href="{{ url_for( 'homepage' ) }}">На главную</a>
                </div>  
            </div>
        </div>
    </header>
    <main class="main">
        <section class="section-1">
            <h1 class="section-1__title">
                Вход
            </h1>
        </section>
        <section class="section-2 _container">
            <form class="section-2__input-block" id="formData">
                <input class="section-2__input-block_input _contact" type="email" name="username" placeholder="Почта" required>
                <input class="section-2__input-block_input _password" type="password" name="password" placeholder="Пароль" required>
                <button class="section-2__input-block_button" type="submit">Войти</button>
                <div id="message"></div>
                <a class="section-2__input-block_link" style="cursor: pointer;" href="{{ url_for('reset_password') }}">
                    Забыли пароль? 
                </a>
                <script>
                    const formElement = document.getElementById('formData');
                    formElement.addEventListener('submit', async function(e) {
                        event.preventDefault();
        
                        const formDates = new FormData(formElement);
                        console.log(formDates)
                        try {
                            const response = await fetch(
                            "/auth/jwt/login", {
                                method: "POST",
                                body: formDates
                                })
                                .catch(err => new Error(err))
                                if (response.ok) {
                                    window.location.href = "/";
                                } 
                            } catch (error) {
                                document.getElementById("message").textContent = error.message
                            }
                    });
                </script>
                <div class="section-2__socialmedia-block">                     
                    <a href="" class="section-2__socialmedia-block_link">
                        <img class="section-2__socialmedia-block_img _logo-telegram" src="img/svg/logo-telegram.svg" alt="">
                    </a>
                </div>
                <a href="{{ url_for('registration') }}" class="section-2__input-block_link _registration">
                    Зарегистрироваться
                </a>
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="footer__policy">
            <p class="footer__policy_text">
                © Все права защищены
            </p>
        </div>
    </footer>
    <script src="{{ url_for( 'static', path='/menu.js' ) }}"></script>
</body>
</html>
