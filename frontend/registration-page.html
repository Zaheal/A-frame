<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://www.sng-it.ru/bitrix/templates/master/js/jquery.inputmask.bundle.min.js"></script>
    <link rel="stylesheet" href="/registration-page-style.css">
    <link id="favicon" rel="icon" type="image/x-icon" href="/img/svg/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Стили плагина Slick -->
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>

    <title>Регистрация</title>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a class="header__logo" href="/homepage.html">
                <div class="header__logo_img"></div>
                <p class="header__logo_text">
                    A-Frame.Kam
                </p>
                <p class="header__logo_text-hidden">
                    A-F.K
                </p>
            </a>
            <div class="header__nav">
                <ul class="header__nav_list">
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="/homepage.html#contacts">
                            Контакты
                        </a>
                    </li>
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="/homepage.html#gallery">
                            Галерея
                        </a>
                    </li>
                    <li class="header__nav_list-item">
                        <a class="header__nav_list-link" href="/homepage.html">
                            На главную
                        </a>
                    </li>
                </ul>
            </div>
            <div class="header__menu">
                <div class="icon-line"></div>
                <div class="icon-line"></div>
                <div class="icon-line"></div>
                <div class="menu-container">
                    <a class="menu-container__link" href="/homepage.html#contacts">Контакты</a>
                    <a class="menu-container__link" href="/homepage.html#gallery">Галерея</a>
                    <a class="menu-container__link" href="/homepage.html">На главную</a>
                </div>  
            </div>
        </div>
    </header>
    <main class="main">
        <section class="section-1">
            <h1 class="section-1__title">
                Регистрация
            </h1>
        </section>
        <section class="section-2 _container">
            <form class="section-2__input-block" id="formData">
                <input class="section-2__input-block_input _contact" type="text" name="name" placeholder="Имя" required>
                <input class="section-2__input-block_input _contact" type="email" name="email" placeholder="Почта" required>
                <input class="section-2__input-block_input _name" id="tel" type="tel" maxlength="18" name="number" placeholder="Номер" required>
                <input class="section-2__input-block_input _password1" type="password" name="password" placeholder="Пароль" required>
                <button class="section-2__input-block_button">Зарегистрироваться</button>
                <div id="message" style="margin-top: 10px;"></div>
                <a href="/login-page.html" class="section-2__input-block_link _singIn">Войти</a>
            </form>
            <script>
                $("#tel").inputmask("+7 (999) 999-99-99"); // Устанавливаем маску

                const formElement = document.getElementById('formData');
                formElement.addEventListener('submit', async (event) => {
                    event.preventDefault();
    
                    const formData = new FormData(formElement);
                    const data = Object.fromEntries(formData.entries())

                    try {
                        const response = await fetch(
                        "/auth/register", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(data)
                            })
                            if (!response.ok) {
                                const err = await response.json()
                                if (err.detail === "REGISTER_USER_ALREADY_EXISTS") {
                                    throw new Error("Пользователь с такой почтой уже существует.")
                                } else {
                                    throw new Error("Пароль должен содержать больше 8 символов.")
                                }
                            } else {
                                window.location.href = "/login"
                            }
                            
                        } catch(error) {
                            document.getElementById("message").textContent = error.message
                        }
                });
            </script>
        </section>
    </main>
    <footer class="footer">
        <div class="footer__policy">
            <p class="footer__policy_text">
                © Все права защищены
            </p>
            <a href="#section1" class="footer__policy_link"></a>
        </div>
    </footer>
      <!-- Бибилиотека Jquery -->
      <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
      <!-- Slick -->
      <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
      <script src="/menu.js"></script>
      <script src="/main.js"></script>
</body>
</html>
